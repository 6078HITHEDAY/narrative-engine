[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "narrative-engine"
version = "0.1.0"
description = "通用 AI 驱动的剧情生成与叙事模拟引擎"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
    "litellm>=1.0",
    "diskcache>=5.0",
    "jinja2>=3.0",
    "python-dotenv>=1.0",
    "httpx>=0.25",
    "instructor>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
narrative-engine = "narrative_engine.cli:main"

[project.optional-dependencies]
api = [
    "fastapi>=0.100",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.20",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.25",
]

[tool.hatch.build.targets.wheel]
packages = ["src/narrative_engine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
