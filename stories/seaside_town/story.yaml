# 海边小镇 — 故事元信息
title: 海边小镇

default_world:
  setting: |
    一个克苏鲁题材的海边小镇，诡异与日常并存。
    鱼人会抱怨今天的鱿鱼不新鲜，古神的低语可能是催促你交房租。
    小镇居民对异常现象习以为常，把它们当作生活的一部分。
  tone: eerie
  era: 模糊的近代——没有手机和互联网，但有电灯和收音机

default_fallback:
  dialogue:
    - "……"
    - "（沉默）"
    - "风吹过，没有人说话。"
    - "他看了看你，什么也没说。"
    - "远处的海鸥叫了一声。"

  event:
    - "远处有什么东西动了一下，但你没看清。"
    - "水面泛起一圈圈涟漪，然后恢复了平静。"
    - "收音机里传来一阵听不懂的低语，然后又变成了天气预报。"
    - "一只猫从巷子里窜出来，嘴里叼着一条闪闪发光的鱼。"

  description:
    - "海风带着咸味和淡淡的腥味。"
    - "远处的灯塔在雾气中明灭。"
    - "路边的街灯嗡嗡作响，投下暖黄色的光。"
    - "天色阴沉，云层低垂，仿佛触手可及。"
